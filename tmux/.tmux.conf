
# Keep C-b as the prefix so i can keep C-a as increment on vim
# unbind C-b
# set -g prefix C-a

# Vim-like key bindings for pane navigation (default uses cursor keys).
unbind h
bind h select-pane -L
unbind j
bind j select-pane -D
unbind k
bind k select-pane -U
unbind l # normally used for last-window
bind l select-pane -R

# Open new/split panes with the path of the current pane.
unbind c
bind c new-window -c '#{pane_current_path}'

# Intuitive window-splitting keys.
bind | split-window -h -c '#{pane_current_path}' # normally prefix-%
bind \\ split-window -h -c '#{pane_current_path}' # normally prefix-%
bind - split-window -v -c '#{pane_current_path}' # normally prefix-"

# Enable vi for copy mode
setw -g mode-keys vi
set-window-option -g mode-keys vi

# Use v to trigger selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X rectangle-toggle

# Use y to yank current selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy

# Start window and pane numbering at 6, (0 is too hard to reach).
set -g base-index 6
set -g pane-base-index 6

# Don't wait for an escape sequence after seeing C-a.
set -s escape-time 0

# Forward modified keys such as Shift+Enter to applications.
set -g extended-keys on
set -g extended-keys-format csi-u

# Set terminal to 256 colors
set -g default-terminal "screen-256color"
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'

# set history limit to go back
set -g history-limit 4096

# set style of tmux
tm_session_name="#[fg=yellow,bold,italics]#S §"
tm_date="#[fg=magenta]%R"
tm_host="#[fg=yellow,bold,italics]#h"
# TrailMix pushes @trailmix_rec while recording; the command runs only then.
tm_trailmix="#{?@trailmix_rec,#(~/.local/bin/trailmix status --tmux) ,}"
set -g status-style 'bg=#373b41,fg=white,bold,italics'
set -g status-left-length 40
set -g status-right-length 60 # Room for the TrailMix recording label.
set -g status-left "$tm_session_name "
set -g status-right " $tm_trailmix$tm_host $tm_date "
set -g status-interval 60 # Default is 15.

# Highlight active window.
set -w -g window-status-current-style bg=red

# Disable mouse to avoid colissions between tmux and vim
set -g mouse off

# Dynamically update iTerm tab and window titles.
set -g set-titles on

# #T      = standard window title (last command, see ~/.bash_profile)
# #h      = short hostname
# #S      = session name
# #W      = tmux window name
#
# (Would love to include #(pwd) here as well, but that would only print the
# current working directory relative to the session -- ie. always the starting
# cwd -- which is not very interesting).
set -g set-titles-string "#T : #h > #S > #W"

# Show bells in window titles.
set -g window-status-bell-style fg=yellow,bold,underscore

# Make the focused pane easy to identify.
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=cyan,bold'

# Show pane labels only when a window has more than one pane.
set -g pane-border-status off
set -g pane-border-format '#{?pane_active,#[fg=cyan bold]> ,#[fg=colour240]}#{pane_index}: #{pane_title}#[default]'
set-hook -g window-layout-changed[42] 'if-shell -F "#{>:#{window_panes},1}" "set-option -w pane-border-status top" "set-option -w pane-border-status off"'

# Keep normal colors in both active and inactive panes.
set -g window-style default
set -g window-active-style default

# But don't change tmux's own window titles.
set -w -g automatic-rename off

# Automatically renumber window numbers on closing a pane (tmux >= 1.7).
set -g renumber-windows on

# copy to Mac OSX clipboard
# if -b 'command -v reattach-to-user-namespace > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | reattach-to-user-namespace pbcopy"'

bind-key -r i run-shell "tmux neww tmux-cht.sh"
